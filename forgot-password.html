    <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="style/auth-responsive.css" />

  <body class="auth-forgot-page">
    <div class="auth-shell">
      <aside class="auth-left-panel" aria-label="Brand intro panel">
        <div class="auth-brand">
          <span class="auth-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5v7.5A1.5 1.5 0 0 0 4.5 19.5h15A1.5 1.5 0 0 0 21 18V10.5"></path><path d="M12 3.5v10"></path><path d="M7 9.5h10"></path><path d="M7 7h10"></path></svg>
          </span>
          <span>MySurePass</span>
        </div>

        <!-- <div class="auth-brand">
          <span class="auth-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5v7.5A1.5 1.5 0 0 0 4.5 19.5h15A1.5 1.5 0 0 0 21 18V10.5"></path><path d="M12 3.5v10"></path><path d="M7 9.5h10"></path><path d="M7 7h10"></path></svg>
          </span>
          <span>MySurePass</span>
        </div> -->

        <div class="auth-left-copy">
          <h1>No Stress, We've Got You Covered</h1>
          <p>Recover your credentials easily and return instantly to solving over 50,000 curriculum-aligned questions.</p>
        </div>

        <!-- <div class="auth-badge" aria-label="Summary card">
          <div class="auth-badge-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9Z"></path><path d="M4 7l8 6 8-6"></path></svg>
          </div>
          <div>
            <span class="auth-badge-title">Instant Recovery</span>
            <span class="auth-badge-copy">Get back to learning in under 2 minutes</span>
          </div>
        </div> -->
      </aside>

      <main class="auth-right-panel">
        <div class="auth-right-inner">
    
          <h2>Forgot your password?</h2>
          <p class="auth-subtext">Enter your email or phone number and we'll send you a secure link to reset your account.</p>

          <form class="auth-form" id="forgotPasswordForm" novalidate>
            <div class="auth-field full-width">
              <label for="forgotIdentifier">Email or Phone Number</label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"></path><path d="M4 7l8 6 8-6"></path></svg>
                </span>
                <input id="forgotIdentifier" name="forgotIdentifier" type="text" autocomplete="email" placeholder="e.g. adebayo@gmail.com" />
              </div>
              <div class="field-error" id="forgotError" aria-live="polite"></div>
            </div>

            <button class="auth-primary-button" id="sendLinkBtn" type="submit">Send Reset Link</button>
          </form>

          <a class="auth-inline-link" href="login.html"><span aria-hidden="true">←</span> Back to Login</a>
        </div>
      </main>
    </div>
  </body>
